[project]
name = "netinf"
version = "0.1.0"
description = "Information-theoretic (net influence) collusion detection for LLM agents"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netinf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
